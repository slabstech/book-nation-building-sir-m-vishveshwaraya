site_name: dwani.ai
site_url: https://slabstech.com/book1
repo_url: https://github.com/slabstech/book1
theme:
  logo: images/dwani-logo.png
  favicon: images/dwani-favicon.ico
  name: material
  features:
    - content.action.edit
    - content.code.copy
    - content.tabs.link
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.highlight
    - search.share
    - toc.follow
    - content.code.copy
    - content.tabs
    - content.action
markdown_extensions:
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed
  - attr_list
  - md_in_html
site_dir: site
plugins:
  - search
exclude_docs: |
  *.py
  node_modules/
  *.git
  venv
use_directory_urls: false
nav:
  - home: index.md
  - Foreword: foreword.md
  - Introductory: introductory.md 
  - The Larger Policies Behind - The Plan : larger_policies.md
  - Retarded Developments : retarded_developments.md 
  - AIDS to Developments : aids_to_developments.md
  - District Development Scheme : district_development_scheme.md 
  - Citizenship Training : citizenship_training.md
  - Foreign Intercourse : foreign_intercourse.md 
  - Co-Ordination and Control : co-ordination_control.md 
  - Summary and Recommendations : summary_recommendation.md
  - India's Future : indias_future.md 